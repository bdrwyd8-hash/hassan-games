name: Build Hassan Games APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Ensure debug.keystore exists
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Prepare Hassan-Games.apk
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Hassan-Games.apk
          cp app/build/outputs/apk/debug/app-debug.apk Hassan-Games-v2.0.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hassan-Games-APK-v2.0
          path: |
            Hassan-Games.apk
            Hassan-Games-v2.0.apk

      - name: Publish Latest APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.${{ github.run_number }}
          name: "Hassan Games Pro v2.0.${{ github.run_number }} (الإصدار الشامل الجديد)"
          body: |
            ### 🚀 الإصدار الشامل الجديد Hassan Games Pro v2.0
            - **One-Tap Game Preparation:** تجهيز الألعاب بضغطة واحدة مع مؤشر المراحل (GAME READY).
            - **Smart Thermal Mode:** الوضع الحراري الذكي المتكيف مع حرارة الجهاز الحقيقية.
            - **Per-Game Profiles:** نظام بروفايلات مستقل ومفصل لكل لعبة مع الحفظ التلقائي.
            - **Notification Shield & Quick Reconnect:** درع عزل الإشعارات والعودة السريعة للعبة.
            - **Auto Settings Advisor:** مستشار إعدادات الجرافيك والفريمات حسب عتاد الهاتف.
            - **Studio HD Voice Changer (بدون مايك أو بالمايك):** مغير صوت صافي (أنثى / رجل / سنجاب / روبوت) مع جمل جاهزة للسماع الفوري بدون تحدث + زر البدء والإنهاء الموحد.
          files: |
            Hassan-Games.apk
            Hassan-Games-v2.0.apk
          make_latest: true
          overwrite: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
