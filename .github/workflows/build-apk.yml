name: Build Hassan Games APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Ensure debug.keystore exists
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Prepare Hassan-Games.apk
        run: cp app/build/outputs/apk/debug/app-debug.apk Hassan-Games.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hassan-Games-APK
          path: Hassan-Games.apk

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "Hassan Games APK v1.0.0"
          body: "تحميل مباشر لتطبيق Hassan Games لتقوية الألعاب وأزرار الكتف L1/R1 والشريط الجانبي العائم."
          files: Hassan-Games.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
